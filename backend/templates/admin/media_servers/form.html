{% extends 'base.html' %}
{% set active_menu = 'media_servers' %}
{% block content %}
<div class="page-header">
  <div>
    <div class="breadcrumb"><a href="{{ url_for('admin.media_servers_index') }}">Servidores de Mídia</a> / {{ 'Editar' if server.id else 'Novo' }}</div>
    <h1>{{ 'Editar' if server.id else 'Novo' }} servidor de mídia</h1>
  </div>
</div>
<div class="card" style="max-width:640px;">
  <div class="card-header"><h5><i data-feather="server" style="width:15px;height:15px;vertical-align:middle;margin-right:6px;"></i>Configurações</h5></div>
  <div class="card-body">
    <form method="post">
      <div class="form-group"><label>Nome</label><input name="name" value="{{ server.name or '' }}" required placeholder="go-engine principal"></div>
      <div class="form-group"><label>URL pública</label><input name="public_url" value="{{ server.public_url or '' }}" required placeholder="https://stream.exemplo.com"></div>
      <div class="form-group"><label>URL interna <span class="muted">(opcional, para health check interno)</span></label><input name="internal_url" value="{{ server.internal_url or '' }}" placeholder="http://go-engine:8080"></div>
      <div class="form-group"><label>API key <span class="muted">(obrigatoria para go-engine)</span></label><input name="api_key" value="{{ server.api_key or '' }}"></div>
      <div class="form-group"><label>Tipo</label>
        <select name="server_type">
          <option value="go-engine" {% if server.server_type == 'go-engine' %}selected{% endif %}>go-engine</option>
          <option value="panel" {% if server.server_type == 'panel' %}selected{% endif %}>panel</option>
          <option value="custom" {% if server.server_type == 'custom' %}selected{% endif %}>custom</option>
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
        <div class="form-group"><label>Prioridade</label><input type="number" name="priority" value="{{ server.priority or 100 }}"></div>
        <div class="form-group"><label>Peso</label><input type="number" name="weight" value="{{ server.weight or 1 }}"></div>
        <div class="form-group"><label>Máx. conexões</label><input type="number" name="max_connections" value="{{ server.max_connections or 0 }}"></div>
      </div>
      <div class="form-group"><label>Região <span class="muted">(opcional)</span></label><input name="region" value="{{ server.region or '' }}" placeholder="br-south-1"></div>
      <div class="form-group form-check"><input type="checkbox" name="is_active" id="is_active" {% if server.is_active %}checked{% endif %}><label for="is_active" style="margin:0;">Ativo</label></div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit"><i data-feather="save"></i> Salvar</button>
        <a class="btn btn-secondary" href="{{ url_for('admin.media_servers_index') }}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
